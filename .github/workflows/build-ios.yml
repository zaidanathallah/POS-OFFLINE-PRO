name: Build iOS IPA (Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS IPA (.ipa)
    runs-on: macos-15
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-offline-pro/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: pos-offline-pro
        run: npm install

      - name: 📱 Generate Native iOS Project & Pods
        working-directory: pos-offline-pro
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
          ls -la

      - name: 🔨 Compile iOS App (.app)
        working-directory: pos-offline-pro/ios
        run: |
          PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
          APP_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          WORKSPACE_FILE="${APP_NAME}.xcworkspace"
          
          echo "Compiling App: $APP_NAME using Workspace: $WORKSPACE_FILE"
          
          xcodebuild \
            -workspace "$WORKSPACE_FILE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 📦 Package into .ipa
        working-directory: pos-offline-pro
        run: |
          APP_BUNDLE=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -type d | head -n 1)
          echo "Packaging App Bundle: $APP_BUNDLE into POSOfflinePRO.ipa"
          mkdir -p Payload
          cp -r "$APP_BUNDLE" Payload/
          zip -r POSOfflinePRO.ipa Payload
          ls -lh POSOfflinePRO.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSOfflinePRO-iOS
          path: pos-offline-pro/POSOfflinePRO.ipa
          retention-days: 7
