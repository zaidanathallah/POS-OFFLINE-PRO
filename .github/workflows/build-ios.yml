name: Build iOS IPA (Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS IPA (.ipa)
    runs-on: macos-14
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-offline-pro/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: pos-offline-pro
        run: npm install

      - name: 📱 Generate Native iOS Project & Pods
        working-directory: pos-offline-pro
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
          ls -la

      - name: 🔨 Compile iOS App Archive
        working-directory: pos-offline-pro/ios
        run: |
          WORKSPACE_FILE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -workspace "$WORKSPACE_FILE" -json | jq -r '.workspace.schemes[0]')
          echo "Building Workspace: $WORKSPACE_FILE with Scheme: $SCHEME_NAME"
          
          xcodebuild archive \
            -workspace "$WORKSPACE_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/POSOfflinePRO.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 📦 Package into .ipa
        working-directory: pos-offline-pro
        run: |
          mkdir -p Payload
          cp -r ios/build/POSOfflinePRO.xcarchive/Products/Applications/*.app Payload/
          zip -r POSOfflinePRO.ipa Payload
          ls -lh POSOfflinePRO.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSOfflinePRO-iOS
          path: pos-offline-pro/POSOfflinePRO.ipa
          retention-days: 7
