name: Build iOS IPA (Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  NODE_VERSION: 22

jobs:
  build-ios:
    name: Build iOS IPA (.ipa)
    runs-on: macos-15
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: 🔍 Verify Apple Toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun swift --version

      - name: ⚙️ Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-offline-pro/package-lock.json

      - name: 🔗 Link Node.js binary for Xcode
        run: |
          set -euxo pipefail
          NODE_PATH=$(which node)
          echo "Node.js found at: $NODE_PATH"
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf "$NODE_PATH" /opt/homebrew/bin/node
          echo "NODE_BINARY=$NODE_PATH" >> "$GITHUB_ENV"

      - name: 📦 Install Dependencies (Deterministic Lockfile)
        working-directory: pos-offline-pro
        run: npm ci

      - name: 📱 Generate Native iOS Project & Pods
        working-directory: pos-offline-pro
        run: |
          set -euxo pipefail
          npx expo prebuild --platform ios --clean
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local
          pod install --repo-update
          ls -la

      - name: 🔨 Compile iOS App (.app)
        working-directory: pos-offline-pro/ios
        run: |
          set -o pipefail
          PROJECT_FILE=$(find . -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)
          APP_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          WORKSPACE_FILE="${APP_NAME}.xcworkspace"

          echo "Compiling App: $APP_NAME using Workspace: $WORKSPACE_FILE"

          xcodebuild \
            -workspace "$WORKSPACE_FILE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "❌ BUILD FAILED. Extracting exact errors from log:"
              grep -E "error:|FAILED|\*\* BUILD FAILED \*\*" xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: 📦 Package into .ipa
        working-directory: pos-offline-pro
        run: |
          set -euxo pipefail
          APP_BUNDLE=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ Release .app was not produced."
            exit 1
          fi
          echo "Packaging App Bundle: $APP_BUNDLE into POSOfflinePRO.ipa"
          rm -rf Payload POSOfflinePRO.ipa
          mkdir -p Payload
          cp -R "$APP_BUNDLE" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload POSOfflinePRO.ipa
          test -s POSOfflinePRO.ipa
          ls -lh POSOfflinePRO.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSOfflinePRO-iOS
          path: pos-offline-pro/POSOfflinePRO.ipa
          if-no-files-found: error
          retention-days: 7
